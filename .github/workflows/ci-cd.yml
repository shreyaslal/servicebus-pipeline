name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build --verbosity normal

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/servicebus-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          LATEST="${{ steps.meta.outputs.image }}"
          LATEST="${LATEST%:*}:latest"
          docker build -t "${{ steps.meta.outputs.image }}" -t "$LATEST" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "$LATEST"

  # Needs Azure OIDC (secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID)
  # and the repo variable AZURE_DEPLOY=true. Skipped otherwise.
  deploy:
    needs: image
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: azure
    env:
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      LOCATION: ${{ vars.LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and app
        run: |
          az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none
          az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep \
            -p prefix="$PREFIX" location="$LOCATION" image="${{ needs.image.outputs.image }}" -o none

      - name: Post-deploy health check
        run: |
          FQDN=$(az deployment group show -g "$RESOURCE_GROUP" -n main --query properties.outputs.appFqdn.value -o tsv)
          echo "Checking https://$FQDN/health"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/health" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check failed" >&2
          exit 1
