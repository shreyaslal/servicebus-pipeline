name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PREFIX: ${{ vars.PREFIX }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build --verbosity normal

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stage 1 - shared infrastructure
        id: infra
        run: |
          az group create -n "$RESOURCE_GROUP" -l "${{ vars.LOCATION || 'centralindia' }}" -o none
          az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep \
            -p prefix="$PREFIX" deployApp=false -o none
          ACR=$(az deployment group show -g "$RESOURCE_GROUP" -n main --query properties.outputs.acrName.value -o tsv)
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          az acr build -r "${{ steps.infra.outputs.acr }}" -t "worker:${{ github.sha }}" .

      - name: Stage 2 - deploy container app
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep \
            -p prefix="$PREFIX" deployApp=true \
               image="${{ steps.infra.outputs.acr }}.azurecr.io/worker:${{ github.sha }}" -o none

      - name: Post-deploy health check
        run: |
          FQDN=$(az deployment group show -g "$RESOURCE_GROUP" -n main --query properties.outputs.appFqdn.value -o tsv)
          echo "Checking https://$FQDN/health"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/health" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check failed" >&2
          exit 1
